
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Your Personal Note Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your thoughts, organized in one place.</p>
  </header>

  <main>
    <section class="section-card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note text</label>
          <input
            type="text"
            id="note-input"
            placeholder="Write your note here..."
            maxlength="500"
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>

      <p id="error-message" role="alert" aria-live="polite"></p>
    </section>

    <section class="section-card" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>

      <label for="search-input">Search your notes</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search by note text..."
      >

      <div class="notes-toolbar">
        <p id="note-count" aria-live="polite">You have no notes yet.</p>
        <button type="button" id="clear-all-button" class="clear-button">
          Clear All
        </button>
      </div>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Keep your thoughts organized.</p>
  </footer>
</body>
</html>
